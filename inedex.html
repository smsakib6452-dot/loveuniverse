<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;height:100dvh;background:#05010a;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#ffd6e8;touch-action:none;user-select:none;-webkit-user-select:none}
  #gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;cursor:grab}
  #gl:active{cursor:grabbing}
  .g{position:fixed;z-index:5;background:rgba(28,4,24,.64);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,120,190,.36);border-radius:18px;box-shadow:0 8px 32px rgba(255,40,120,.22);transition:opacity .3s ease,transform .3s ease}
  #info{left:16px;top:16px;padding:12px 16px;max-width:calc(100vw - 220px)}
  #info h1{margin:0;font-size:19px;letter-spacing:.8px;background:linear-gradient(90deg,#ff7eb6,#ffd36e,#ff7832,#b79cff);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  #info .sub-brand{font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:#ff944d;background:rgba(255,120,50,.15);border:1px solid rgba(255,140,60,.45);padding:2px 8px;border-radius:99px}
  #info div{font-size:12.5px;margin-top:4px;opacity:.92}#info b{color:#fff}

  /* Brand Badge — Desktop & Mobile Optimized */
  #brand{right:16px;bottom:102px;padding:8px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-color:rgba(255,130,50,.5);background:rgba(20,5,18,.78);box-shadow:0 6px 24px rgba(255,100,30,.22)}
  #brand:hover{transform:translateY(-2px) scale(1.02);border-color:#ff7b29;box-shadow:0 0 26px rgba(255,120,40,.45)}
  #brand img{height:38px;width:auto;max-width:175px;display:block;filter:drop-shadow(0 2px 8px rgba(255,120,40,.35))}

  /* Floating Zoom & Read Controls (Right Side) */
  #zoomBox{right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;padding:7px;border-radius:16px}
  #zoomBox button{padding:8px 10px;font-size:13px;border-radius:11px;min-width:40px;display:flex;align-items:center;justify-content:center}
  #zoomRead{font-size:11px!important;padding:6px 8px!important;background:linear-gradient(135deg,rgba(255,42,85,.35),rgba(255,154,41,.35));border-color:rgba(255,180,120,.45)!important}

  /* Bottom Control Dock */
  #bar{left:50%;bottom:max(12px,env(safe-area-inset-bottom,12px));transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;padding:10px 12px;align-items:center;max-width:96vw;width:max-content}
  .bar-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;width:100%}
  button,select,input{font:600 12.5px system-ui,-apple-system,'Segoe UI',sans-serif;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px 11px;color:#fff;background:rgba(255,255,255,.12);cursor:pointer;outline:none;transition:all .2s ease;flex-shrink:0}
  /* Clear human-readable text labels on action buttons */
  button[data-label]::after{content:" " attr(data-label);font-weight:600;font-size:12px;letter-spacing:.2px}
  #snap{background:linear-gradient(135deg,rgba(40,180,255,.28),rgba(120,80,255,.28));border-color:rgba(130,210,255,.45)}
  #rec{background:linear-gradient(135deg,rgba(255,45,85,.32),rgba(255,120,50,.32));border-color:rgba(255,130,150,.5)}
  #rec.on{background:linear-gradient(135deg,#ff1744,#ff6d00);animation:pulseRec 1.2s infinite}
  @keyframes pulseRec{0%,100%{box-shadow:0 0 12px rgba(255,30,70,.6)}50%{box-shadow:0 0 24px rgba(255,30,70,1)}}
  input{width:170px;cursor:text;background:rgba(255,255,255,.18);border-color:rgba(255,150,200,.4);user-select:text;-webkit-user-select:text}
  input:focus{border-color:#ff8533;box-shadow:0 0 12px rgba(255,133,51,.4);background:rgba(255,255,255,.24)}
  select option{color:#000;background:#fff}
  button.on{background:linear-gradient(135deg,#ff2a55,#ff9a29);border-color:rgba(255,215,150,.75);box-shadow:0 0 14px rgba(255,70,110,.5)}
  #upBtn{background:linear-gradient(135deg,rgba(255,80,150,.38),rgba(255,140,40,.38));border-color:rgba(255,175,120,.55)}
  button:hover,select:hover{background:rgba(255,255,255,.24);transform:translateY(-1px)}
  button:active{transform:scale(.96)}
  .input-wrap{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.32);padding:2px 8px 2px 3px;border-radius:13px;border:1px solid rgba(255,120,190,.32)}
  .input-wrap input{border:0;background:transparent;padding:6px 7px;width:148px}
  .input-wrap input:focus{box-shadow:none}
  #charCnt{font-size:11px;color:#ffb8d9;opacity:.85;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
  #hint{right:16px;top:16px;padding:10px 14px;font-size:12px;line-height:1.6;max-width:258px}
  #cam{position:fixed;left:16px;bottom:135px;width:140px;border-radius:14px;transform:scaleX(-1);z-index:5;display:none;border:1px solid #ff7eb6}
  #gest{position:fixed;left:16px;top:115px;z-index:5;font-weight:700;text-shadow:0 0 10px #f0a}
  #toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-15px);z-index:12;background:linear-gradient(135deg,#ff2a55,#ff7a29);color:#fff;padding:8px 16px;border-radius:99px;font:600 12.5px system-ui;opacity:0;pointer-events:none;transition:all .3s ease;box-shadow:0 6px 20px rgba(0,0,0,.45);white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #msg{position:fixed;inset:0;z-index:9;background:#05010a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font:600 18px/1.6 system-ui;color:#ff9ac8;padding:20px;transition:opacity .6s}
  #msg img{height:58px;width:auto;margin-bottom:14px;filter:drop-shadow(0 0 14px rgba(255,120,40,.45))}

  /* Hide-UI Clean View Mode for Mobile Screenshots / Fullscreen Viewing */
  body.clean-ui #bar,body.clean-ui #hint{opacity:0;pointer-events:none;transform:translate(-50%,20px)}
  #toggleUi{position:fixed;left:16px;bottom:102px;z-index:6;padding:7px 11px;font-size:12px;border-radius:99px;background:rgba(28,4,24,.65);border:1px solid rgba(255,120,190,.35);backdrop-filter:blur(10px)}

  /* ---- Mobile-First Responsive Layout (Phones & Compact Screens) ---- */
  @media (max-width:768px){
    #hint{display:none}
    #info{left:10px;top:max(10px,env(safe-area-inset-top,10px));padding:7px 11px;max-width:54vw;border-radius:14px}
    #info h1{font-size:13.5px;gap:5px}
    #info .sub-brand{display:none}
    #info div{font-size:11px;margin-top:2px}
    #brand{right:10px;top:max(10px,env(safe-area-inset-top,10px));bottom:auto;padding:6px 10px;border-radius:14px;max-width:41vw}
    #brand img{height:27px;max-width:100%;object-fit:contain}

    #zoomBox{right:10px;top:42%;padding:5px;gap:5px;border-radius:14px}
    #zoomBox button{padding:7px 8px;font-size:12px;min-width:34px}
    #zoomRead{font-size:10px!important;padding:5px 6px!important}

    #toggleUi{left:10px;bottom:auto;top:42%;transform:translateY(-50%);padding:7px 9px;font-size:11px}

    #bar{bottom:max(8px,env(safe-area-inset-bottom,8px));width:96vw;max-width:96vw;padding:8px 9px;gap:6px;border-radius:16px}
    #shapeRow{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    #shapeRow::-webkit-scrollbar{display:none}
    #toolRow{flex-wrap:wrap;gap:5px;justify-content:center}
    button,select{padding:6px 8px;font-size:11.5px;border-radius:10px}
    button[data-label]::after{font-size:11px}
    .input-wrap{flex:1 1 125px;min-width:118px}
    .input-wrap input{width:100%;font-size:12px;padding:5px 6px}
    #theme{max-width:115px;text-overflow:ellipsis}
    #den{max-width:74px}
  }
</style>
</head>

/* ---- High-Clarity Text Atlas: 4 cols x 8 rows, 512x64 cells ---- */
const at=document.createElement('canvas');at.width=2048;at.height=512;const ac=at.getContext('2d');
ac.fillStyle='#fff';ac.textAlign='center';ac.textBaseline='middle';
PH.forEach((p,i)=>{let f=42;const fam='"Nirmala UI","Segoe UI","Noto Sans","Arial Unicode MS",sans-serif';
  ac.font=`bold ${f}px ${fam}`;const w=ac.measureText(p).width;if(w>460){f=Math.floor(f*460/w);ac.font=`bold ${f}px ${fam}`}
  ac.fillText(p,(i%4)*512+256,Math.floor(i/4)*64+34)});
const tex=new THREE.CanvasTexture(at);
tex.anisotropy=8;
tex.minFilter=THREE.LinearFilter;
tex.magFilter=THREE.LinearFilter;

/* ---- renderer ---- */
const cv=$('gl'),renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false,alpha:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setClearColor(0x05010a);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.005,100);cam.position.z=16;
const U={
  uMix:{value:1},uT:{value:0},uCol:{value:1},uBurst:{value:0},
  uRes:{value:new THREE.Vector2()},uTex:{value:tex},uPh:{value:PH.length},
  uHueBase:{value:.9},uHueSpan:{value:.17},uRoseCol:{value:1},
  uTextBoost:{value:1},uIsPhoto:{value:0},uCrisp:{value:0}
};
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  const s=renderer.getSize(new THREE.Vector2()).multiplyScalar(renderer.getPixelRatio());U.uRes.value.copy(s)}
addEventListener('resize',resize);resize();

/* Upgraded Ultra-HD Shader:
   - uCrisp tightens distant particle footprint to 2.2x1.8px and dampens micro-wiggle on Rose & Face Photo so images are 2.5x sharper!
   - Anti-washout tone mapping keeps bright facial skin & golden rose petals detailed without clipping to flat white! */
const mat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute vec3 aA;attribute vec3 aB;attribute vec2 aR;attribute vec3 aCol;
uniform float uMix,uT,uCol,uBurst,uPh,uHueBase,uHueSpan,uRoseCol,uTextBoost,uIsPhoto,uCrisp;uniform vec2 uRes;varying vec2 vUv;varying vec3 vC;varying float vPh,vK;
vec3 hsv(float h,float s,float v){vec3 k=clamp(abs(fract(h+vec3(0.,.6667,.3333))*6.-3.)-1.,0.,1.);return v*mix(vec3(1.),k,s);}
void main(){
  float t=clamp(uMix*1.5-aR.x*.5,0.,1.),e=t*t*(3.-2.*t);
  vec3 p=mix(aA,aB,e);
  p+=sin(e*3.14159)*vec3(sin(aR.y*40.+uT),cos(aR.y*33.+uT),sin(aR.y*27.))*1.1;
  p*=uCol*(1.+uBurst*(.4+aR.y*1.3));
  float wigBase=clamp(1.3-(uTextBoost-1.)*.35,.12,1.);
  float wig=mix(wigBase,wigBase*.14,uCrisp);
  p+=.025*wig*vec3(sin(uT*1.5+aR.y*90.),cos(uT*1.3+aR.x*80.),sin(uT+aR.y*70.));
  vec4 mv=modelViewMatrix*vec4(p,1.);
  float ppu=uRes.y*.5*projectionMatrix[1][1]/max(-mv.z,.002);
  vec2 sz=vec2(.068,.0092)*uTextBoost;
  float minW=mix(5.0,2.2,uCrisp),minH=mix(2.4,1.8,uCrisp);
  float kx=max(1.,minW/(sz.x*ppu)),ky=max(1.,minH/(sz.y*ppu));
  mv.xy+=position.xy*sz*vec2(kx,ky);
  vK=sqrt(kx*ky);vUv=uv;vPh=floor(fract(aR.y*131.7)*uPh);
  float tw=mix(.7+.3*sin(uT*2.+aR.x*60.),.88+.12*sin(uT*1.5+aR.x*60.),uCrisp);
  vec3 themeC=hsv(uHueBase+uHueSpan*fract(aR.y*17.3)+.04*sin(uT*.5+p.y),.62+.3*fract(aR.x*9.1),tw);
  if(fract(aR.x*53.)>.97&&uIsPhoto<.5)themeC=vec3(1.,.95,.8);
  float photoLum=clamp(dot(aCol,vec3(.333))*1.28,.16,1.15);
  themeC*=mix(1.,photoLum,uIsPhoto);
  vec3 roseC=aCol*tw;
  vC=mix(themeC,roseC,uRoseCol);
  gl_Position=projectionMatrix*mv;}`,
fragmentShader:`uniform sampler2D uTex;uniform float uPh,uCrisp;varying vec2 vUv;varying vec3 vC;varying float vPh,vK;
void main(){float c=mod(vPh,4.),r=floor(vPh/4.);
  float a=texture2D(uTex,vec2((c+vUv.x)/4.,(7.-r+vUv.y)/8.)).a;
  float dotMode=step(1.02,vK);
  a=max(a,dotMode*mix(.1,.16,uCrisp));
  float distAlpha=clamp(mix(1.6,1.05,uCrisp)/vK,mix(.06,.038,uCrisp),1.);
  float alphaScale=mix(1.0,distAlpha,dotMode);
  gl_FragColor=vec4(vC,a*alphaScale);}`});

/* ---- Ultra-HD 400x400 Stratified Reference Rose Sampler ---- */
let roseCDF=null,roseRGB=null,roseSZ=400;
function prepareRoseData(){
  if(roseCDF)return;
  const img=$('roseRef');
  if(!img||!img.complete||!img.naturalWidth)return;
  const SZ=img.naturalWidth||400;roseSZ=SZ;
  const c=document.createElement('canvas');c.width=SZ;c.height=SZ;
  const ctx=c.getContext('2d');ctx.drawImage(img,0,0,SZ,SZ);
  const d=ctx.getImageData(0,0,SZ,SZ).data;
  const tot=SZ*SZ;
  roseRGB=new Float32Array(tot*3);
  const lum=new Float32Array(tot);
  for(let i=0;i<tot;i++){
    const r=d[i*4]/255,g=d[i*4+1]/255,b=d[i*4+2]/255;
    roseRGB[i*3]=r;roseRGB[i*3+1]=g;roseRGB[i*3+2]=b;
    lum[i]=0.5*(r+g);
  }
  roseCDF=new Float32Array(tot);
  let acc=0;
  for(let y=0;y<SZ;y++){
    for(let x=0;x<SZ;x++){
      const i=y*SZ+x;
      const r=roseRGB[i*3],g=roseRGB[i*3+1];
      let w=0;
      if(r>0.07){
        const xm=x>1?x-2:0,xp=x<SZ-2?x+2:SZ-1,ym=y>1?y-2:0,yp=y<SZ-2?y+2:SZ-1;
        const blur=(lum[ym*SZ+xm]+lum[ym*SZ+x]+lum[ym*SZ+xp]+lum[y*SZ+xm]+lum[i]+lum[y*SZ+xp]+lum[yp*SZ+xm]+lum[yp*SZ+x]+lum[yp*SZ+xp])/9;
        const edge=Math.max(0,lum[i]-blur);
        const baseInt=Math.max(r*0.85,g);
        w=Math.pow(baseInt,0.88)+2.4*edge;
      }
      acc+=w;
      roseCDF[i]=acc;
    }

function sampleRoseParticles(N,posOut,colOut){
  prepareRoseData();
  const r=Math.random;
  if(!roseCDF){
    for(let i=0;i<N;i++){colOut[i*3]=1;colOut[i*3+1]=.25;colOut[i*3+2]=.35}
    return;
  }
  const SZ=roseSZ,tot=SZ*SZ;
  /* Golden-ratio stratified quasi-random sequence eliminates random clumping & empty gaps */
  let seed=r();
  for(let i=0;i<N;i++){
    seed=(seed+0.618033988749895)%1;
    const u=(i+r()*0.85)/N;
    const q=((i*2654435761)>>>0)%N;
    const stratU=(q+seed)/N;
    let lo=0,hi=tot-1;
    while(lo<hi){
      const mid=(lo+hi)>>1;
      if(roseCDF[mid]<stratU)lo=mid+1;else hi=mid;
    }
    const py=(lo/SZ)|0,px=lo%SZ;
    const jx=px+(r()-0.5)*0.68,jy=py+(r()-0.5)*0.68;
    const nx=(jx/SZ)*2-1,ny=1-(jy/SZ)*2;
    const scale=3.35;
    const x2d=nx*scale,y2d=(ny+0.05)*scale;

    const pR=roseRGB[lo*3],pG=roseRGB[lo*3+1],pB=roseRGB[lo*3+2];

    const dm=Math.hypot((nx+0.02)/0.45,(ny-0.18)/0.33);
    const inM=dm<1.05;
    const zDome=inM?0.45*(1+Math.cos(Math.min(1,dm/1.05)*3.141593)):0;
    const zRelief=inM?(0.28*pG+0.16*pR)*(1-0.4*Math.min(1,dm)):0;

    const db=Math.hypot((nx-0.56)/0.16,(ny-0.16)/0.16);
    const inB=db<1.05;
    const zBud=inB?(0.26*(1+Math.cos(Math.min(1,db/1.05)*3.141593))+0.18*pG):0;

    const zLeaf=(!inM&&!inB)?(0.24*Math.sin(nx*3.6)-0.10*Math.abs(nx)):0;

    const isBack=(inM||inB)&&(r()<0.16)&&(pG<0.52);
    const zFront=zDome+zRelief+zBud+zLeaf+(r()-0.5)*0.022;
    const zBack=-(zDome*0.82+zBud*0.82)+(r()-0.5)*0.028;
    const z=isBack?zBack:zFront;

    const pComp=(7-z)/7;
    posOut[i*3]=x2d*pComp;
    posOut[i*3+1]=y2d*pComp;
    posOut[i*3+2]=z;

    colOut[i*3]=Math.min(1,Math.pow(pR,0.72)*1.28);
    colOut[i*3+1]=Math.min(1,pG>0.38?Math.pow(pG,0.78)*1.18:pG*0.38);
    colOut[i*3+2]=Math.min(1,pG>0.65?Math.pow(pB,0.82)*1.02:pB*0.48);
  }
}

function processPortraitSource(imgOrCanvas){
  const SZ=PHOTO_SZ,tot=SZ*SZ;
  const c=document.createElement('canvas');c.width=SZ;c.height=SZ;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#05010a';ctx.fillRect(0,0,SZ,SZ);

  const sw=imgOrCanvas.naturalWidth||imgOrCanvas.width||SZ;
  const sh=imgOrCanvas.naturalHeight||imgOrCanvas.height||SZ;
  const sc=Math.max(SZ/sw,SZ/sh);
  const dw=sw*sc,dh=sh*sc;
  const dx=(SZ-dw)*0.5,dy=(SZ-dh)*0.36;
  ctx.drawImage(imgOrCanvas,dx,dy,dw,dh);

  const d=ctx.getImageData(0,0,SZ,SZ).data;
  photoRGB=new Float32Array(tot*3);
  photoLum=new Float32Array(tot);
  photoSobel=new Float32Array(tot);
  photoDetail=new Float32Array(tot);

  /* Auto-percentile dynamic range stretch */
  let minL=1,maxL=0;
  for(let i=0;i<tot;i++){
    const r=d[i*4]/255,g=d[i*4+1]/255,b=d[i*4+2]/255;
    const l=0.299*r+0.587*g+0.114*b;
    if(l<minL)minL=l;if(l>maxL)maxL=l;
  }
  const rangeL=Math.max(0.22,maxL-minL*0.6);
  for(let i=0;i<tot;i++){
    const r=Math.min(1,Math.max(0,(d[i*4]/255-minL*0.45)/rangeL));
    const g=Math.min(1,Math.max(0,(d[i*4+1]/255-minL*0.45)/rangeL));
    const b=Math.min(1,Math.max(0,(d[i*4+2]/255-minL*0.45)/rangeL));
    photoRGB[i*3]=r;photoRGB[i*3+1]=g;photoRGB[i*3+2]=b;
    photoLum[i]=0.299*r+0.587*g+0.114*b;
  }

  /* Estimate corner background color to suppress uniform walls/skies */
  let bgR=0,bgG=0,bgB=0,bgCnt=0;
  for(let y=0;y<32;y++){
    for(let x=0;x<32;x++){
      const i1=y*SZ+x,i2=y*SZ+(SZ-1-x);
      bgR+=photoRGB[i1*3]+photoRGB[i2*3];
      bgG+=photoRGB[i1*3+1]+photoRGB[i2*3+1];
      bgB+=photoRGB[i1*3+2]+photoRGB[i2*3+2];
      bgCnt+=2;
    }
  }
  bgR/=bgCnt;bgG/=bgCnt;bgB/=bgCnt;

  /* Compute Unsharp Masking (local detail) + Sobel facial feature gradient */
  let maxSob=0.001;
  for(let y=2;y<SZ-2;y++){
    for(let x=2;x<SZ-2;x++){
      const i=y*SZ+x;
      /* 5x5 local mean for Unsharp Masking */
      const blur=(
        photoLum[(y-2)*SZ+(x-2)]+photoLum[(y-2)*SZ+x]+photoLum[(y-2)*SZ+(x+2)]+
        photoLum[y*SZ+(x-2)]+photoLum[i]+photoLum[y*SZ+(x+2)]+
        photoLum[(y+2)*SZ+(x-2)]+photoLum[(y+2)*SZ+x]+photoLum[(y+2)*SZ+(x+2)]
      )/9;
      photoDetail[i]=photoLum[i]-blur;

      const gx=(photoLum[i+1]-photoLum[i-1])*0.5 + (photoLum[i-SZ+1]-photoLum[i-SZ-1]+photoLum[i+SZ+1]-photoLum[i+SZ-1])*0.25;
      const gy=(photoLum[i+SZ]-photoLum[i-SZ])*0.5 + (photoLum[i+SZ-1]-photoLum[i-SZ-1]+photoLum[i+SZ+1]-photoLum[i-SZ+1])*0.25;
      const mag=Math.hypot(gx,gy);
      photoSobel[i]=mag;
      if(mag>maxSob)maxSob=mag;
    }
  }
  const sobScale=1/Math.max(0.07,maxSob*0.62);
  for(let i=0;i<tot;i++)photoSobel[i]=Math.min(1,photoSobel[i]*sobScale);

  photoCDF=new Float32Array(tot);
  let acc=0;
  for(let y=0;y<SZ;y++){
    const ny=1-(y/SZ)*2;
    for(let x=0;x<SZ;x++){
      const nx=(x/SZ)*2-1;
      const i=y*SZ+x;
      const radV=Math.hypot(nx*0.86,(ny-0.02)*0.80);
      const vig=Math.max(0,Math.min(1,1-Math.pow(Math.max(0,radV-0.66)/0.38,2)));
      const cDist=Math.hypot(photoRGB[i*3]-bgR,photoRGB[i*3+1]-bgG,photoRGB[i*3+2]-bgB);
      const bgSuppress=(radV>0.52&&cDist<0.15&&photoSobel[i]<0.16)?0.08:1.0;

      const lSharp=Math.min(1,Math.max(0,photoLum[i]+1.75*photoDetail[i]));
      const sob=photoSobel[i];
      /* Balanced HD weight: smooth skin tones + sharp eyes/eyebrows/lips/hair */
      let w=(0.52*Math.pow(lSharp,0.78)+1.55*Math.pow(sob,0.85)+0.08)*vig*bgSuppress;
      if(w<0.03)w=0;
      acc+=w;
      photoCDF[i]=acc;
    }
  }
  if(acc>0)for(let i=0;i<tot;i++)photoCDF[i]/=acc;
}

function samplePortraitParticles(N,posOut,colOut){
  if(!photoCDF)processPortraitSource(createDefaultPortraitCanvas());
  const r=Math.random,SZ=PHOTO_SZ,tot=SZ*SZ;
  let seed=r();
  for(let i=0;i<N;i++){
    seed=(seed+0.618033988749895)%1;
    const q=((i*2654435761)>>>0)%N;
    const stratU=(q+seed)/N;
    let lo=0,hi=tot-1;
    while(lo<hi){
      const mid=(lo+hi)>>1;
      if(photoCDF[mid]<stratU)lo=mid+1;else hi=mid;
    }
    const py=(lo/SZ)|0,px=lo%SZ;
    /* Tight 0.62px sub-pixel jitter on 440x440 grid for ultra-sharp facial features */
    const jx=px+(r()-0.5)*0.62,jy=py+(r()-0.5)*0.62;
    const nx=(jx/SZ)*2-1,ny=1-(jy/SZ)*2;
    const scale=3.3;

    const det=photoDetail[lo]*1.65;

    const pG=Math.min(1,Math.max(0,photoRGB[lo*3+1]+det));
    const pB=Math.min(1,Math.max(0,photoRGB[lo*3+2]+det));
    const pLum=photoLum[lo],pSob=photoSobel[lo];

    const df=Math.hypot(nx/0.58,(ny-0.05)/0.68);

    const z=zDome+0.34*pLum+0.14*pSob+(r()-0.5)*0.018;

    const pComp=(7-z)/7;
    posOut[i*3]=x2d*pComp;
    posOut[i*3+1]=y2d*pComp;
    posOut[i*3+2]=z;

    /* Controlled gamma (1.12) prevents highlight blowout on cheeks/forehead while edgeRim outlines dark eyes/brows/hair */
    const edgeRim=pSob*Math.max(0,0.48-pLum)*0.95;
    colOut[i*3]=Math.min(1,Math.max(0.03,Math.pow(pR,1.12)*0.88+edgeRim));
    colOut[i*3+1]=Math.min(1,Math.max(0.03,Math.pow(pG,1.12)*0.88+edgeRim*0.76));
    colOut[i*3+2]=Math.min(1,Math.max(0.03,Math.pow(pB,1.12)*0.88+edgeRim*0.86));
  }
}

/* ---- Upgraded Multi-line High-Resolution 3D Text Sampler ---- */
function wrapTextLines(raw){
  const text=(raw||'LOVE').trim()||'LOVE';
  if(text.includes('|'))return text.split('|').map(s=>s.trim()).filter(Boolean).slice(0,4);
  if(text.length<=16)return [text];
  const words=text.split(/\s+/);
  const maxPerLine=text.length<=32?Math.ceil(text.length/2):Math.ceil(text.length/3);
  const lines=[];let curLine='';
  for(const w of words){
    if(!curLine)curLine=w;
    else if((curLine+' '+w).length<=maxPerLine+3)curLine+=' '+w;
    else{lines.push(curLine);curLine=w}
  }
  if(curLine)lines.push(curLine);
  if(lines.length===1&&text.length>18){
    const mid=Math.ceil(text.length/2);
    return [text.slice(0,mid),text.slice(mid)];
  }
  return lines.slice(0,4);
}

  const lineH=f*1.18,totalH=lineH*(lines.length-1),startY=320-totalH/2;

  const spanScale=lines.length>1||name.length>14?.0052:.0046;
  for(let i=0;i<N;i++){
    const q=L[Math.random()*L.length|0],px=q%2048,py=(q/2048)|0;
    o[i*3]=(px-1024)*spanScale+(Math.random()-.5)*.01;
    o[i*3+1]=-(py-320)*spanScale;
    o[i*3+2]=(Math.random()-.5)*.25;
  }
}

function build(n){
  say('Building '+n.toLocaleString('en-IN')+' I-love-yous…');
  setTimeout(()=>{
    if(mesh){scene.remove(mesh);geo.dispose()}
    N=n;geo=new THREE.InstancedBufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array([-.5,-.5,0,.5,-.5,0,.5,.5,0,-.5,.5,0]),3));
    geo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array([0,0,1,0,1,1,0,1]),2));geo.setIndex([0,1,2,0,2,3]);
    const rColArr=new Float32Array(N*3);
    const pColArr=new Float32Array(N*3);
    attrs=[];
    for(let t=0;t<SHAPE_COUNT;t++){
      const a=new Float32Array(N*3);
      gen(t,N,a,t===9?pColArr:rColArr);
      attrs.push(new THREE.InstancedBufferAttribute(a,3));
    }
    roseColAttr=new THREE.InstancedBufferAttribute(rColArr,3);
    photoColAttr=new THREE.InstancedBufferAttribute(pColArr,3);
    geo.setAttribute('aCol',cur===9?photoColAttr:roseColAttr);
    U.uIsPhoto.value=cur===9?1:0;
    U.uCrisp.value=(cur===5||cur===7||cur===8||cur===9)?1:0;
    const R=new Float32Array(N*2);for(let i=0;i<N*2;i++)R[i]=Math.random();
    geo.setAttribute('aR',new THREE.InstancedBufferAttribute(R,2));
    geo.setAttribute('aA',attrs[cur]);geo.setAttribute('aB',attrs[cur]);geo.instanceCount=N;
    mesh=new THREE.Mesh(geo,mat);mesh.frustumCulled=false;scene.add(mesh);U.uMix.value=1;
    $('cnt').textContent=N.toLocaleString('en-IN');$('msg').style.opacity=0;setTimeout(()=>$('msg').style.display='none',600);
  },60)}

function setShape(s){if(s===cur&&U.uMix.value>=1)return;prev=cur;cur=s;
  if(s===5||s===7||s===8||s===9||s===3||s===0){tY=Math.round(tY/6.283185)*6.283185;tX=0}
  U.uCrisp.value=(s===5||s===7||s===8||s===9)?1:0;
  if(s===9){
    geo.setAttribute('aCol',photoColAttr);
    U.uIsPhoto.value=1;U.uRoseCol.value=1;$('theme').value='5';
  }else{
    geo.setAttribute('aCol',roseColAttr);
    U.uIsPhoto.value=0;
    if(s===5){U.uRoseCol.value=1;$('theme').value='5'}
  }
  geo.setAttribute('aA',attrs[prev]);geo.setAttribute('aB',attrs[cur]);U.uMix.value=0;
  document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===s));
  playChime(320+s*45)}

function updateTextParticles(val,switchShape=true){
  const raw=val||'LOVE';
  name=raw.replace(/[a-z]/g,c=>c.toUpperCase());

  if(!attrs[3])return;
  const a=attrs[3].array;textPts(N,a);attrs[3].needsUpdate=true;
  if(switchShape){
    if(cur!==3)setShape(3);else{geo.setAttribute('aA',attrs[3]);U.uMix.value=1}
  }
  idle=performance.now();
}

/* ---- Web Audio API Ambient Space Synth ---- */
let actx=null,musicOn=false,oscNodes=[];
function playChime(freq=440){
  if(!musicOn||!actx)return;
  try{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(freq,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq*1.5,actx.currentTime+0.45);
    g.gain.setValueAtTime(0.06,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+0.5);
    o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.52);
  }catch(_){}
}
$('music').onclick=()=>{
  if(musicOn){
    musicOn=false;$('music').classList.remove('on');
    oscNodes.forEach(n=>{try{n.stop()}catch(_){}});oscNodes=[];
    toast('🔇 Ambient music off');return;
  }
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const freqs=[130.81,196.00,246.94,293.66];
    freqs.forEach((f,i)=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.type=i%2?'triangle':'sine';o.frequency.value=f;
      g.gain.value=0.022;
      o.connect(g);g.connect(actx.destination);o.start();
      oscNodes.push(o);
    });
    musicOn=true;$('music').classList.add('on');
    playChime(523.25);
    toast('🎵 Cosmic ambient sound on');
  }catch(_){toast('⚠ Audio unavailable')}
};

/* ---- Deep Zoom & Interaction ---- */
const MIN_Z=0.07;
const MAX_Z=16;
let rotY=0,rotX=0,tY=0,tX=0,targetZ=7,burst=0,idle=performance.now(),collapseT=1;
const ptr=new Map();let pd=0,lastTap=0;

function setZoomZ(zVal){
  idle=performance.now();
  targetZ=Math.min(MAX_Z,Math.max(MIN_Z,zVal));
  $('zoomRead').classList.toggle('on',targetZ<0.85);
}

$('zoomIn').onclick=()=>setZoomZ(targetZ*0.58);
$('zoomOut').onclick=()=>setZoomZ(targetZ*1.72);
$('zoomRead').onclick=()=>{
  if(targetZ>0.65){
    setZoomZ(0.28);
    toast('🔍 Deep Read Zoom (25×) — Tap 🔍 Read again to reset');
  }else{
    setZoomZ(7);
    toast('🔭 Zoom reset to 1×');
  }
};

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  ptr.set(e.pointerId,e);
  idle=performance.now();
  if(ptr.size===1){
    const now=performance.now();
    if(now-lastTap<280){
      setZoomZ(targetZ>1.2?0.32:7);
      lastTap=0;
    }else lastTap=now;
  }
});
cv.addEventListener('pointerup',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;idle=performance.now();
  const rotScale=Math.min(1,Math.max(0.18,cam.position.z/5));
  if(ptr.size===1){tY+=(e.clientX-o.clientX)*.006*rotScale;tX+=(e.clientY-o.clientY)*.006*rotScale}
  else if(ptr.size===2){const [a,b]=[...ptr.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd&&d>4)setZoomZ(targetZ*Math.pow(pd/d,1.25));pd=d}
  ptr.set(e.pointerId,e)});
cv.addEventListener('pointerup',()=>pd=0);
cv.addEventListener('wheel',e=>{e.preventDefault();setZoomZ(targetZ*Math.exp(e.deltaY*.0018))},{passive:false});

/* ---- optional hand control ---- */
let hand=null,handOn=false,H=null,want=-1,stable=0,wasFist=false;
const load=s=>new Promise((res,rej)=>{const e=document.createElement('script');e.src=s;e.onload=res;e.onerror=()=>rej(new Error('Cannot load '+s));document.head.appendChild(e)});
const TIP=[4,8,12,16,20],PIP=[2,6,10,14,18],d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const ext=(l,i)=>d2(l[TIP[i]],l[0])>d2(l[PIP[i]],l[0])*1.16;
$('hand').onclick=async()=>{
  if(handOn){handOn=false;$('cam').style.display='none';$('gest').textContent='';$('hand').classList.remove('on');return}
  try{say('Loading hand tracking…');
    if(!window.Hands){await load('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js');await load('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js')}
    if(!hand){hand=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
      hand.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.7,minTrackingConfidence:.6});hand.onResults(r=>H=r);
      await hand.initialize();const v=$('cam');await new Camera(v,{onFrame:async()=>{if(handOn)await hand.send({image:v})},width:640,height:480}).start()}
    handOn=true;$('cam').style.display='block';$('hand').classList.add('on');$('msg').style.display='none'}
  catch(err){say('⚠ Hand mode failed: '+(err.message||err)+'<br><small>Allow the camera, or open this file in Chrome/Edge directly. Mouse mode still works.</small>');
    setTimeout(()=>$('msg').style.display='none',4500)}};
function handStep(){
  const L=(H&&H.multiHandLandmarks)||[];let fist=false,g='';
  if(!handOn||!L.length){$('gest').textContent=handOn?'Show your hand ✋':'';collapseT=1;wasFist&&(burst=1.8);wasFist=false;return}
  idle=performance.now();
  const n=L.map(l=>[0,1,2,3,4].filter(i=>ext(l,i)).length);fist=n.every(k=>k===0);
  if(L.length===2){const d=d2(L[0][9],L[1][9]);setZoomZ(16*Math.pow(MIN_Z/16,Math.min(1,Math.max(0,(d-.1)/.6))));g='🙌 ZOOM'}
  else{tY=(.5-L[0][9].x)*Math.PI*2.2;tX=(L[0][9].y-.5)*1.2;
    if(!fist){const w=Math.min(n[0],5);if(w>=1){if(w===want)stable++;else{want=w;stable=0}if(stable>8)setShape(w>=4?(w===4?2:3):w-1)}g=w+' ✋'}}
  collapseT=fist?.1:1;if(wasFist&&!fist)burst=2;wasFist=fist;$('gest').textContent=fist?'✊ COLLAPSE':g}

/* ---- URL params init ---- */
(function initFromUrl(){
  try{
    const p=new URLSearchParams(location.search);
    if(p.get('text')){const tx=p.get('text').slice(0,60);$('name').value=tx;name=tx.replace(/[a-z]/g,c=>c.toUpperCase());$('charCnt').textContent=tx.length+'/60';cur=3}
    if(p.get('shape')!==null){const s=+p.get('shape');if(s>=0&&s<SHAPE_COUNT)cur=s}
    if(p.get('theme')!==null){const thIdx=+p.get('theme');if(THEMES[thIdx]){$('theme').value=String(thIdx);applyTheme(thIdx)}}
    document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===cur));
  }catch(_){}
})();

/* ---- loop ---- */
const DEMO_ORDER=[0,5,7,8,1,2,4,6];
let demoIdx=0,t0=performance.now();
let recHook=null;
function frame(){requestAnimationFrame(frame);if(!mesh)return;
  const now=performance.now(),dt=Math.min(.05,(now-t0)/1000);t0=now;U.uT.value+=dt;
  handStep();
  if(U.uMix.value<1)U.uMix.value=Math.min(1,U.uMix.value+dt/2.6);
  if(now-idle>12000&&U.uMix.value>=1&&!ptr.size&&targetZ>1.5&&cur!==9){idle=now-3000;demoIdx=(demoIdx+1)%DEMO_ORDER.length;setShape(DEMO_ORDER[demoIdx])}
  if(now-idle>2500&&!handOn&&cur!==5&&cur!==9&&targetZ>1.5)tY+=dt*.15;
  burst*=.95;U.uBurst.value=burst;U.uCol.value+=(collapseT-U.uCol.value)*.12;
  rotY+=(tY-rotY)*.1;rotX+=(tX-rotX)*.1;mesh.rotation.set(rotX,rotY,0);
  cam.position.z+=(targetZ-cam.position.z)*.09;
  const zRatio=7/cam.position.z;
  U.uTextBoost.value=zRatio>2.2?Math.min(3.4,1+Math.log2(zRatio/2.2)*0.68):1;
  $('zm').textContent=(zRatio>=10?Math.round(zRatio):zRatio.toFixed(1))+'×';
  renderer.render(scene,cam);
  if(recHook)recHook(now)}

const rImg=$('roseRef');
if(rImg&&!rImg.complete){
  rImg.onload=()=>{build(300000);frame();setTimeout(()=>targetZ=7,200)};
  rImg.onerror=()=>{build(300000);frame();setTimeout(()=>targetZ=7,200)};
}else{
  build(300000);frame();
  setTimeout(()=>targetZ=7,200);
}

/* ---- Branded Snapshot & True MP4 Social-Media Video Recorder ---- */
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()};
function drawBrandedFrame(targetCanvas){
  const ctx=targetCanvas.getContext('2d');
  ctx.drawImage(cv,0,0,targetCanvas.width,targetCanvas.height);
  const logo=$('brandLogo');
  if(logo&&logo.complete&&logo.naturalWidth){
    const lw=Math.min(targetCanvas.width*0.22,260),lh=lw*(logo.naturalHeight/logo.naturalWidth);
    ctx.save();ctx.globalAlpha=0.92;
    ctx.drawImage(logo,targetCanvas.width-lw-24,targetCanvas.height-lh-20,lw,lh);
    ctx.restore();
  }
}

$('snap').onclick=()=>{
  renderer.render(scene,cam);
  const out=document.createElement('canvas');out.width=cv.width;out.height=cv.height;
  drawBrandedFrame(out);
  out.toBlob(b=>{dl(b,'sakibs-creation-love-'+Date.now()+'.png');toast('📸 Branded HD Photo saved!')});
};

let recState=null;
$('rec').onclick=async()=>{
  if(recState){
    await recState.stop();
    recState=null;
    $('rec').textContent='⏺';
    $('rec').dataset.label='Record Video';
    $('rec').classList.remove('on');
    return;
  }
  const rw=cv.width&~1,rh=cv.height&~1;
  const recCv=document.createElement('canvas');recCv.width=rw;recCv.height=rh;

  const mp4Types=[
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=avc1.42E01E',
    'video/mp4;codecs=avc1',
    'video/mp4;codecs=h264',
    'video/mp4'
  ];
  const supportedMp4=typeof MediaRecorder!=='undefined'?mp4Types.find(t=>MediaRecorder.isTypeSupported(t)):null;

  if(supportedMp4){
    const ch=[];
    drawBrandedFrame(recCv);
    const stream=recCv.captureStream(30);
    const mr=new MediaRecorder(stream,{mimeType:supportedMp4,videoBitsPerSecond:10e6});
    mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
    mr.onstop=()=>{
      dl(new Blob(ch,{type:'video/mp4'}),'sakibs-creation-love-'+Date.now()+'.mp4');
      toast('🎬 MP4 video downloaded!');
    };
    recHook=()=>drawBrandedFrame(recCv);
    mr.start();
    recState={stop:async()=>{recHook=null;mr.stop()}};
    $('rec').textContent='⏹';$('rec').dataset.label='Stop Video';$('rec').classList.add('on');
    toast('⏺ Recording MP4 video… Click ⏹ Stop Video when done');
    return;
  }

  if(typeof VideoEncoder!=='undefined'){
    try{
      toast('⏳ Preparing MP4 encoder…');
      if(!window.Mp4Muxer){
        await load('https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js');
      }
      const muxer=new Mp4Muxer.Muxer({
        target:new Mp4Muxer.ArrayBufferTarget(),
        video:{codec:'avc',width:rw,height:rh},
        fastStart:'in-memory'
      });
      const encoder=new VideoEncoder({
        output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
        error:e=>console.error(e)
      });
      encoder.configure({codec:'avc1.42001f',width:rw,height:rh,bitrate:8e6,framerate:30});
      let frameIdx=0,lastCapture=0;
      recHook=now=>{
        if(now-lastCapture<32)return;
        lastCapture=now;
        drawBrandedFrame(recCv);
        const vf=new VideoFrame(recCv,{timestamp:frameIdx*33333});
        encoder.encode(vf,{keyFrame:frameIdx%60===0});
        vf.close();
        frameIdx++;
      };
      recState={
        stop:async()=>{
          recHook=null;
          toast('⏳ Finalizing MP4 file…');
          await encoder.flush();
          muxer.finalize();
          const buf=muxer.target.buffer;
          dl(new Blob([buf],{type:'video/mp4'}),'sakibs-creation-love-'+Date.now()+'.mp4');
          toast('🎬 MP4 video downloaded!');
        }
      };
      $('rec').textContent='⏹';$('rec').dataset.label='Stop Video';$('rec').classList.add('on');
      toast('⏺ Recording MP4 video… Click ⏹ Stop Video when done');
      return;
    }catch(_){}
  }

  const fallbackMime=(typeof MediaRecorder!=='undefined'&&MediaRecorder.isTypeSupported('video/webm;codecs=h264'))?'video/webm;codecs=h264':'video/webm';
  const ch=[];
  drawBrandedFrame(recCv);
  const mr=new MediaRecorder(recCv.captureStream(30),{mimeType:fallbackMime,videoBitsPerSecond:10e6});
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=()=>{
    dl(new Blob(ch,{type:'video/mp4'}),'sakibs-creation-love-'+Date.now()+'.mp4');
    toast('🎬 MP4 video downloaded!');
  };
  recHook=()=>drawBrandedFrame(recCv);
  mr.start();
  recState={stop:async()=>{recHook=null;mr.stop()}};
  $('rec').textContent='⏹';$('rec').dataset.label='Stop Video';$('rec').classList.add('on');
  toast('⏺ Recording MP4 video… Click ⏹ Stop Video when done');
};
